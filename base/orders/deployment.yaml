apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: devsecops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: orders-service

  template:
    metadata:
      labels:
        app: orders-service

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: orders-service
          image: 359062857260.dkr.ecr.us-east-1.amazonaws.com/devsecops/orders-service:build-42-b1651ad
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: DATABASE_URL

            - name: USERS_URL
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: USERS_URL

            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: INVENTORY_URL

            - name: HTTP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: HTTP_TIMEOUT_SECONDS

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3